<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Localização para WhatsApp</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#ece5dd;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.card{
    background:#fff;
    width:100%;
    max-width:500px;
    padding:25px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

h2{
    text-align:center;
    color:#075e54;
    margin-bottom:20px;
}

button{
    width:100%;
    border:none;
    padding:15px;
    margin-top:10px;
    border-radius:10px;
    font-size:17px;
    cursor:pointer;
    font-weight:bold;
}

#buscar{
    background:#075e54;
    color:white;
}

#whatsapp{
    background:#25D366;
    color:white;
    display:none;
}

#resultado{
    margin-top:20px;
    background:#f7f7f7;
    padding:15px;
    border-radius:10px;
    white-space:pre-wrap;
    line-height:1.5;
}

small{
    color:#777;
}
</style>

</head>
<body>

<div class="card">

<h2>📍 Minha Localização</h2>

<button id="buscar">
Obter Localização
</button>

<button id="whatsapp">
Enviar pelo WhatsApp
</button>

<div id="resultado">
Aguardando...
</div>

</div>

<script>

let mensagem="";

document.getElementById("buscar").onclick=obterLocalizacao;

function obterLocalizacao(){

document.getElementById("resultado").innerHTML="Obtendo localização...";

if(!navigator.geolocation){
alert("Seu navegador não suporta Geolocalização.");
return;
}

navigator.geolocation.getCurrentPosition(
sucesso,
erro,
{
enableHighAccuracy:true,
timeout:15000,
maximumAge:0
}
);

}

async function sucesso(pos){

const lat=pos.coords.latitude;
const lon=pos.coords.longitude;

let endereco="Não encontrado";

try{

const resposta=await fetch(
`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`
);

const dados=await resposta.json();

if(dados.display_name){
endereco=dados.display_name;
}

}catch(e){
console.log(e);
}

mensagem=
`Coordenadas:

${lat}, ${lon}

Endereço:

${endereco}`;

document.getElementById("resultado").innerText=mensagem;

document.getElementById("whatsapp").style.display="block";

}

function erro(e){

document.getElementById("resultado").innerHTML=
"Não foi possível obter a localização.";

}

document.getElementById("whatsapp").onclick=function(){

const texto=encodeURIComponent(mensagem);

window.open(
"https://wa.me/?text="+texto,
"_blank"
);

};

</script>

</body>
</html>
